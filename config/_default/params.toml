# -- Theme Options --
# These options control how the theme functions and allow you to
# customise the display of your website.
#
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/configuration/#theme-parameters

# ============================================================
# 常用修改位置：
# - 首页背景和布局：搜索 [homepage]
# - 文章页外观：搜索 [article]
# - 文章列表外观：搜索 [list]
# ============================================================


# --- 全站外观 ------------------------------------------------

# 配色方案。blowfish 是默认蓝色，简洁耐看。
# 其他可选：avocado、fire、ocean、forest、noir、slate、github 等。
colorScheme = "blowfish"
defaultAppearance = "light" # 默认明暗模式：light 浅色；dark 深色。
autoSwitchAppearance = true # 是否跟随访问者的系统自动切换明暗模式。

# --- 全站功能 ------------------------------------------------

enableA11y = false # 无障碍辅助按钮。追求简洁可保持关闭。
enableSearch = true # 站内搜索。开启时 hugo.toml 的 outputs.home 必须包含 JSON。

# 代码块右上角的“复制代码”按钮。
# 开启时还要保证 markup.toml 中 highlight.noClasses = false。
enableCodeCopy = true

enableStructuredBreadcrumbs = false # 搜索引擎使用的结构化面包屑数据。
# enableStyledScrollbar = true # Blowfish风格滚动条。true：禁用原生滚动条，false：开启原生滚动条

replyByEmail = false # 文章末尾的邮件回复入口；需要配置作者邮箱。

# 首页最近文章来自哪些 content 子目录。
# 例如文章在 content/article/，可以取消下面的注释：
# mainSections = ["section1", "section2"]
# robots = "" # robots 元数据，通常无需设置。


# --- 图片处理 ------------------------------------------------

disableImageOptimization = false # false 表示保留 Hugo 的图片压缩、缩放和优化。
disableImageOptimizationMD = false # 是否只关闭 Markdown 图片 ![](路径) 的优化。
disableTextInHeader = false # true 时页眉只显示 Logo，不显示文字。
# backgroundImageWidth = 1200 # 背景图片处理后的宽度，通常保持默认。

# background 首页和 background Hero 使用的全站默认背景。
# 图片应位于 assets/img/background.svg。
# 如果把首页 layout 改成 background，建议取消下面的注释。
defaultBackgroundImage = "img/background.svg" 

# defaultFeaturedImage = "img/background.svg" # 所有没有单独封面的文章使用的默认封面。

# defaultSocialImage = "/android-chrome-512x512.png" # 分享到社交平台时使用的默认图片。
hotlinkFeatureImage = false # 是否直接热链接外部封面。使用本地图片时保持 false。

# 缩略图比例：1.5 约为 3:2，1.777 约为 16:9。
# thumbnailAspectRatio = "1.5" 
# imagePosition = "50% 50%" # 图片主体位置：50% 50% 居中；50% 30% 会偏上


# --- 菜单与文章目录 ------------------------------------------

highlightCurrentMenuArea = true # 访问某个栏目时，高亮对应的顶部菜单。
smartTOC = true # 智能目录：阅读到哪个标题，就高亮哪个目录项。
smartTOCHideUnfocusedChildren = false # 是否隐藏当前阅读区域以外的深层目录。false 会保留完整目录。

# 静态资源指纹算法，用于避免浏览器缓存旧 CSS/JS。
fingerprintAlgorithm = "sha512" # Valid values are "sha512" (default), "sha384", "sha256"

# Gitea / Forgejo 短代码的默认服务器；不用短代码时没有影响。
giteaDefaultServer = "https://git.fsfe.org"
forgejoDefaultServer = "https://v11.next.forgejo.org"


# --- 多语言自动跳转 ------------------------------------------

[languageRedirect]
  enabled = false # Enable client-side language redirects for multilingual sites.
  storageKey = "blowfish_preferred_language" # localStorage key for manual language selections.
  # fallbackLanguage = "" # Language to use when no browser language matches. Defaults to Hugo's default content language.
  browserRedirectHomeOnly = true # Restrict browser-language redirects to home pages.
  storedLanguageRedirect = true # Redirect to the stored language when a matching translation exists.

[seo]
# metaDescriptionOrder = ["summary", "description", "site"] # Controls the fallback order for the HTML meta description. Valid values are "summary", "description", and "site".

[header]
  layout = "basic" # valid options: basic, fixed, fixed-fill, fixed-gradient, fixed-fill-blur

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

# --- 首页外观：最常修改的部分 -------------------------------

[homepage] # 首页布局管理
  # 六种首页布局：
  # page       普通 Markdown 首页
  # profile    头像、简介、社交链接首页
  # hero       大图视觉首页
  # card       图片卡片首页
  # background 整页背景首页
  # custom     自定义模板，需要自己写 custom.html
  layout = "background"

  # 首页主图。必须存在：assets/img/background.svg
  homepageImage = "img/background.svg"  # 只有hero，card，background布局方式才能正常显示图片：

  showRecent = false # 是否在首页展示最近写的文章
  showRecentItems = 4  # 最近文章展示的数量
  showMoreLink = false  # 最近文章末尾是否显示“查看更多”。

  # “查看更多”跳转地址。
  # 如果文章目录是 content/article/，建议改为 "/article/"。
  showMoreLinkDest = "/posts/"

  cardView = false  # 最近文章是否使用图片卡片。false 更简洁。
  cardViewScreenWidth = false # 卡片是否扩展到屏幕宽度，仅在 cardView = true 时生效。

  # background为首页布局时，滚动时是否模糊背景；
  layoutBackgroundBlur = false # 仅在布局（layout）设置为 background 时生效

  # hero为首页布局时，是否关闭图片滤镜。
  # false 保留滤镜，文字更清楚；true 更接近图片原色。
  disableHeroImageFilter = false # 仅在布局（layout）设置为 hero 时生效

# --- 单篇文章页面 --------------------------------------------

[article]
  # 日期、更新时间和作者信息。
  showDate = true

  showViews = false   # 阅读量需要 Firebase，未配置时保持关闭。
  showLikes = false   # 点赞量需要 Firebase，未配置时保持关闭。
  showDateOnlyInArticle = false # 仅在文章详情页显示发布日期；不在列表卡片显示日期。
  showDateUpdated = true # 是否显示文章「更新时间」
  showAuthor = true # 文章显示作者信息
  showAuthorBottom = false # 是否在文章底部显示作者简介卡片

  showHero = true   # 文章顶部封面。
  heroStyle = "thumbAndBackground" # 开启showHero后可选：basic（基础班）、big（宽大版）、background（全屏背景）、thumbAndBackground（缩略图+背景）。

  # 背景式 Hero 的模糊和顶部间距设置。
  layoutBackgroundBlur = true # 仅在heroStyle等于background或thumbAndBackground时使用。
  layoutBackgroundHeaderSpace = true # 仅当 heroStyle 为 background 时才使用
  
  showBreadcrumbs = true # 面包屑导航，页面顶部「文档 / 分类 / 当前文章」路径导航条。
  showDraftLabel = true # 用：草稿标签，当文章是 draft: true 草稿状态时，页面标题旁边显示红色「DRAFT」草稿标记。
  
  showEdit = false # 页面底部「编辑此页」按钮，点击跳转到 GitHub 该篇 Markdown 的编辑页面，方便直接在线修改文章。
  # editURL = "https://github.com/username/repo/" # 编辑此页的链接
  editAppendPath = true # 编辑链接是否自动拼接文章 md 文件路径
  
  seriesOpened = false #文章系列（series）组件
  showHeadingAnchors = true # 鼠标悬浮标题，显示 # 锚点链接

  showPagination = true # 开启文章底部分页导航：上一篇 / 下一篇文章按钮。
  invertPagination = true # 底部分页导航是否反转分页顺序：

  showReadingTime = false # 显示阅读时长
  showTableOfContents = true # 显示文章目录（TOC） 的开关

  # showRelatedContent = false  # 控制：文章底部是否显示相关推荐文章 豆包说已经废弃
  # relatedContentLimit = 3 # 相关推荐文章显示的数量
  showTaxonomies = false # 相关文章模块里面，是否显示标签 / 分类（taxonomies，tags、categories）。只对相关文章区块生效。
  showCategories = true # 相关文章卡片里，是否显示分类 categories；依赖上面 taxonomies = true 才生效。
  showTags = true # 相关文章卡片里面是否展示 tags 标签。依赖 taxonomies = true 才生效。
  showCategoriesInSecondaryColor = false # 相关文章卡片内的分类标签徽章，是否使用第二主题颜色渲染，用来区分分类和标签。只有 taxonomies = true 才生效。
  showAuthorsBadges = false # 相关文章卡片中，是否显示作者徽章标签。

  showWordCount = false # 文章标题下方显示字数统计（共多少字）
  # sharingLinks = [ "linkedin", "twitter", "bluesky", "mastodon", "reddit", "pinterest", "facebook", "email", "whatsapp", "telegram", "line"] # 文章底部分享按钮，弹出可以分享到各个社交平台的链接列表。
  showZenMode = false # 阅读禅模式按钮，点击后隐藏侧边栏、导航栏，只保留文章正文，沉浸式阅读。
  # externalLinkForceNewTab = false # 外部链接是否强制在新标签页打开。

# --- 文章列表页，例如 /article/ ------------------------------

[list]

  # 列表页不使用 Hero 和卡片，保持普通简洁样式。
  showHero = true # 文章列表页封面
  # 开启showHero后可选：basic（基础班）、big（宽大版）、background（全屏背景）、thumbAndBackground（缩略图+背景）。
  heroStyle = "thumbAndbackground"

  layoutBackgroundBlur = true # Hero 头部背景图是否启用模糊效果。生效前提：heroStyle = "background" 或者 heroStyle = "thumbAndBackground"。
  layoutBackgroundHeaderSpace = true # 当 heroStyle = "background" 背景大图模式时，Hero 头部是否保留上方空白间距
  showBreadcrumbs = false # 页面上方显示面包屑导航（主页 > 分类 > 当前文章）
  showSummary = false # 相关文章卡片里面，是否展示文章摘要 summary，仅针对相关文章区块。
  showViews = false # 文章是否展示阅读浏览量（访问计数）。
  showLikes = false # 文章模块显示点赞按钮。静态站本身无后端，需要第三方点赞服务支持。
  showTableOfContents = false # 文章是否显示目录 TOC（侧边 / 文章内目录）
  showCards = false # 相关文章区块内，是否使用卡片样式渲染相关文章条目。仅对相关推荐模块生效。
  
  # 排序和显示形式。
  orderByWeight = true # 是否已weight方式进行排序，需要在md添加属性weight
  groupByYear = false # 文章列表是否已年分组

  cardView = false # 列表页（首页、分类页）是否整体使用卡片视图展示文章列表
  cardViewScreenWidth = false # 卡片视图模式下，卡片是否占满屏幕宽度。
  constrainItemsWidth = false # 列表页面（首页、分类列表）内容元素，是否约束最大内容宽度；配合 cardView 卡片模式使用。

# --- 网站地图 ------------------------------------------------

[sitemap]
  excludedKinds = ["taxonomy", "term"]

# --- 分类总览页，例如 /categories/、/tags/ ------------------

[taxonomy]
  showTermCount = true # 分类 / 标签列表页面上，徽章后面显示该标签、分类下的文章数量
  showHero = false # 首页是否渲染 Hero 头部大标题区块。
  # heroStyle = "background" # valid options: basic, big, background, thumbAndBackground
  layoutBackgroundBlur = true # only used when heroStyle equals background or thumbAndBackground
  layoutBackgroundHeaderSpace = true # only used when heroStyle equals background
  showBreadcrumbs = false
  showViews = false
  showLikes = false
  showTableOfContents = false
  cardView = false

# --- 单个分类或标签页，例如 /tags/hugo/ ---------------------

[term]
  showHero = false
  # heroStyle = "background" # valid options: basic, big, background, thumbAndBackground
  layoutBackgroundBlur = true # only used when heroStyle equals background or thumbAndBackground
  layoutBackgroundHeaderSpace = true # only used when heroStyle equals background
  showBreadcrumbs = false
  showViews = false
  showLikes = false
  showTableOfContents = true
  groupByYear = false
  cardView = false
  cardViewScreenWidth = false

