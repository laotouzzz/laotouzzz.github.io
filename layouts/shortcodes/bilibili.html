{{- $bvid := .Get "bvid" -}}
{{- $page := .Get "page" | default "1" -}}

<div style="
  position: relative;
  width: 100%;
  padding-bottom: 56.25%;
  margin: 1.5rem 0;
  overflow: hidden;
  border-radius: 8px;
  background: #000000;
">
  <iframe
    src="https://player.bilibili.com/player.html?bvid={{ $bvid }}&page={{ $page }}&autoplay=0"
    title="哔哩哔哩视频"
    scrolling="no"
    frameborder="0"
    allowfullscreen
    style="
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    ">
  </iframe>
</div>
