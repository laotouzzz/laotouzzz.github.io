name: Build Hugo Site
on:
  push:
    branches: [ main ]
  # 支持从 Actions 页面手动重新发布。
  workflow_dispatch:

permissions:
  contents: read

# GitHub Pages 同一时间只允许一个发布任务；后续任务排队。
# 保留正在进行的部署，避免连续推送导致部署请求冲突。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3.3.0
        with:
          hugo-version: '0.170.1'

      - name: Build
        run: hugo --minify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
